version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intervuz-app
    depends_on:
      - postgres
    environment:
      HTTP_PORT: "8000"
      DATABASE_URL: postgres://intervuz:intervuz@postgres:5432/intervuz?sslmode=disable
      ACCESS_TOKEN_SECRET: dev-access-secret
      REFRESH_TOKEN_SECRET: dev-refresh-secret
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: intervuz-postgres
    environment:
      POSTGRES_DB: intervuz
      POSTGRES_USER: intervuz
      POSTGRES_PASSWORD: intervuz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/000000_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    restart: unless-stopped

volumes:
  postgres_data:
