services:
  postgres:
    image: postgres:16-alpine
    container_name: intervuz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intervuz}
      POSTGRES_USER: ${POSTGRES_USER:-intervuz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intervuz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/000000_init.up.sql:/docker-entrypoint-initdb.d/000000_init.up.sql:ro
      - ./db/migrations/000001_structure_units.up.sql:/docker-entrypoint-initdb.d/000001_structure_units.up.sql:ro
      - ./db/migrations/000002_schedule_source_events.up.sql:/docker-entrypoint-initdb.d/000002_schedule_source_events.up.sql:ro
      - ./db/migrations/000003_academic_groups_structure_fields.up.sql:/docker-entrypoint-initdb.d/000003_academic_groups_structure_fields.up.sql:ro
      - ./db/migrations/000004_room_bookings.up.sql:/docker-entrypoint-initdb.d/000004_room_bookings.up.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intervuz-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_PORT: ${HTTP_PORT:-8000}
      ROOT_IMAGE_PATH: ${ROOT_IMAGE_PATH:-/app/image_floor/Карта МГТУ-1-10-4_page-0001.jpg}
      PLACES_DATA_PATH: ${PLACES_DATA_PATH:-/app/GEO_Json/points.json}
      SCHEDULE_DATA_DIR: ${SCHEDULE_DATA_DIR:-/app/schedule/lksJSON}

      STRUCTURE_API_URL: ${STRUCTURE_API_URL:-https://lks.bmstu.ru/lks-back/api/v1/structure}
      SCHEDULE_GROUP_API_BASE_URL: ${SCHEDULE_GROUP_API_BASE_URL:-https://lks.bmstu.ru/lks-back/api/v1/schedules/groups}
      STRUCTURE_TARGET_ROOT_UUID: ${STRUCTURE_TARGET_ROOT_UUID:-8c1b7bb8-e690-11db-89c3-000cf1a7cbf0}

      DATABASE_DSN: postgres://${POSTGRES_USER:-intervuz}:${POSTGRES_PASSWORD:-intervuz}@postgres:5432/${POSTGRES_DB:-intervuz}?sslmode=disable
      ACADEMIC_WEEK1_START_DATE: ${ACADEMIC_WEEK1_START_DATE:?ACADEMIC_WEEK1_START_DATE is required}

      SYNC_ON_STARTUP: ${SYNC_ON_STARTUP:-false}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-72h}

      NEWS_API_URL: ${NEWS_API_URL:-https://api.www.bmstu.ru/news}
      NEWS_SYNC_ENABLED: ${NEWS_SYNC_ENABLED:-false}
      NEWS_SYNC_INTERVAL: ${NEWS_SYNC_INTERVAL:-24h}
      NEWS_SYNC_LIMIT: ${NEWS_SYNC_LIMIT:-10}

      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://polza.ai/api/v1}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
      ASSISTANT_TIMEOUT: ${ASSISTANT_TIMEOUT:-30s}
      ASSISTANT_CONTEXT_MAX_CHARS: ${ASSISTANT_CONTEXT_MAX_CHARS:-120000}

      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres_data:
