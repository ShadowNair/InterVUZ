<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!--
    Vertex markup:
    - data-vertex-id: required vertex id
    - data-place-id: optional binding to place id from points.json
    - data-building / data-floor: required for corridor nodes without place binding
    - cx/cy or x/y or data-x/data-y: vertex coordinates
    - data-accessible: optional, defaults to place accessibility or true
  -->
  <circle data-vertex-id="v-entrance" data-building="1" data-floor="1" cx="20" cy="60" r="4" />
  <circle data-vertex-id="place_100" data-place-id="place_100" cx="60" cy="60" r="4" />
  <circle data-vertex-id="v-corridor-turn" data-building="1" data-floor="1" cx="110" cy="60" r="4" />
  <circle data-vertex-id="place_102" data-place-id="place_102" cx="160" cy="60" r="4" />

  <!--
    Edge markup:
    - data-from / data-to: required ids of connected vertices
    - data-edge-id: optional edge id
  -->
  <line data-edge-id="e1" data-from="v-entrance" data-to="place_100" x1="20" y1="60" x2="60" y2="60" />
  <line data-edge-id="e2" data-from="place_100" data-to="v-corridor-turn" x1="60" y1="60" x2="110" y2="60" />
  <line data-edge-id="e3" data-from="v-corridor-turn" data-to="place_102" x1="110" y1="60" x2="160" y2="60" />
</svg>
